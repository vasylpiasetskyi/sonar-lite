services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar_lite
    ports:
      - "5432:5432"
    volumes:
      - sonar_lite_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar_lite"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sonar:sonar@db:5432/sonar_lite
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sonar_lite_pgdata:
